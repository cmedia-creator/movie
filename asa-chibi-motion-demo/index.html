<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090d">
<title>ASA Motion Demo</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:#08080c;font-family:Arial,"Noto Sans JP",sans-serif
}
body{display:grid;place-items:center}
#stage{
  position:relative;
  width:min(100vw,56.25svh);
  height:100svh;
  overflow:hidden;
  color:#fff;
  background:
    radial-gradient(circle at 50% 38%,rgba(120,89,116,.32) 0,rgba(45,32,45,.22) 31%,transparent 55%),
    linear-gradient(180deg,#17121b 0%,#0e0c12 55%,#07070a 100%);
  isolation:isolate
}
#stage::before{
  content:"";position:absolute;inset:0;opacity:.34;z-index:0;
  background:
    linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px),
    linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:30px 30px
}
#stage::after{
  content:"";position:absolute;inset:0;z-index:9;pointer-events:none;
  background:radial-gradient(circle at 50% 55%,transparent 41%,rgba(0,0,0,.62) 100%)
}

/* Header: separated structurally, not by fragile absolute coordinates. */
#header{
  position:absolute;z-index:12;
  top:max(5.8%,calc(env(safe-area-inset-top) + 18px));
  left:7%;
  display:flex;flex-direction:column;align-items:flex-start;gap:24px;
  pointer-events:none
}
#logo{
  font-size:clamp(48px,14vw,72px);font-weight:900;line-height:.82;letter-spacing:-.08em;
  opacity:0;transform:translateY(-8px);transition:opacity .38s ease,transform .38s ease
}
#sub{
  margin-left:2px;font-size:clamp(10px,2.6vw,13px);line-height:1.1;
  letter-spacing:.28em;color:rgba(255,255,255,.70);white-space:nowrap;
  opacity:0;transition:opacity .38s ease
}

/*
  Motion rig:
  pos     = entrance / stage placement
  physics = anticipation / squash / hop / overshoot
  breathe = continuous tiny life motion
  sprite  = actual transparent PNG

  Keeping transforms on separate nested layers prevents the snapping/conflicts
  that made the previous pass feel rough.
*/
#actorPos{
  position:absolute;z-index:5;
  left:-45%;bottom:17.1%;
  width:min(54vw,292px);aspect-ratio:1/1;
  transform-origin:50% 90%;
  will-change:left
}
#actorPhysics,#actorBreathe{
  position:absolute;inset:0;
  transform-origin:50% 88%;
  will-change:transform
}
#actorBreathe{
  animation:microLife 2.15s ease-in-out infinite
}
#actor{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:contain;object-position:center bottom;
  filter:drop-shadow(0 14px 8px rgba(0,0,0,.55));
  user-select:none;-webkit-user-drag:none
}
@keyframes microLife{
  0%,100%{transform:translateY(0) rotate(-.15deg) scale(1)}
  34%{transform:translateY(-2.2px) rotate(.25deg) scale(1.004,.997)}
  67%{transform:translateY(-.4px) rotate(-.25deg) scale(.998,1.003)}
}

/* Shadow carries weight, rather than being decorative wallpaper. */
#shadow{
  position:absolute;z-index:4;left:50%;bottom:16.72%;
  width:min(23vw,122px);height:min(3.2vw,17px);
  transform:translateX(-50%);
  border-radius:999px;
  background:radial-gradient(ellipse at center,rgba(0,0,0,.48) 0%,rgba(0,0,0,.25) 56%,transparent 82%);
  filter:blur(2px);opacity:.88;
  animation:shadowIdle 2.15s ease-in-out infinite;
  will-change:transform,opacity
}
@keyframes shadowIdle{
  0%,100%{transform:translateX(-50%) scale(1);opacity:.88}
  34%{transform:translateX(-50%) scale(.965,.92);opacity:.77}
  67%{transform:translateX(-50%) scale(.99,.96);opacity:.83}
}

.floor{
  position:absolute;z-index:2;left:8%;right:8%;bottom:16.86%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.42),transparent);
  box-shadow:0 0 27px rgba(255,255,255,.13)
}
#caption{
  position:absolute;z-index:12;left:7%;right:7%;
  bottom:max(7.4%,calc(env(safe-area-inset-bottom) + 18px));
  text-align:center;font-size:clamp(12px,3.6vw,18px);font-weight:900;
  letter-spacing:.14em;text-shadow:0 3px 12px #000;
  transition:opacity .18s ease,transform .18s ease
}

/* Serious / charm use an intentional reaction cut-in, so half-body art never replaces the full-body actor. */
#reaction{
  position:absolute;z-index:8;right:7%;top:27%;
  width:min(24vw,118px);aspect-ratio:1/1;
  border-radius:28px;overflow:hidden;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.16);
  box-shadow:0 14px 34px rgba(0,0,0,.32);
  opacity:0;transform:translateY(8px) scale(.88) rotate(2deg);
  pointer-events:none
}
#reaction img{
  width:100%;height:100%;object-fit:cover;object-position:center 18%;
  transform:scale(1.52) translateY(8%);
}
#reaction.show{
  animation:reactionIn .42s cubic-bezier(.2,.85,.2,1) forwards
}
@keyframes reactionIn{
  0%{opacity:0;transform:translateY(10px) scale(.82) rotate(3deg)}
  62%{opacity:1;transform:translateY(-3px) scale(1.035) rotate(-1deg)}
  100%{opacity:1;transform:translateY(0) scale(1) rotate(0)}
}
#reaction::after{
  content:"";position:absolute;inset:0;border-radius:inherit;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)
}

/* Small effects are anchored at the sides/feet so they do not become head bubbles. */
#fx{position:absolute;inset:0;z-index:7;pointer-events:none}
.fx{
  position:absolute;font-size:clamp(16px,4.6vw,25px);opacity:0;
  animation:fxFloat 1.55s cubic-bezier(.15,.72,.32,1) forwards
}
@keyframes fxFloat{
  0%{opacity:0;transform:translateY(14px) scale(.65)}
  22%{opacity:.92}
  100%{opacity:0;transform:translateY(-66px) scale(1.08) rotate(9deg)}
}
.stepDot{
  position:absolute;width:5px;height:5px;border-radius:50%;
  background:rgba(255,255,255,.62);filter:blur(.2px);
  opacity:0;animation:stepDust .72s ease-out forwards
}
@keyframes stepDust{
  0%{opacity:.65;transform:translate(0,0) scale(.7)}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.15)}
}

#replay{
  position:absolute;z-index:15;
  top:max(3%,calc(env(safe-area-inset-top) + 8px));right:4%;
  border:1px solid rgba(255,255,255,.24);background:rgba(0,0,0,.34);color:#fff;
  padding:7px 10px;border-radius:999px;font-size:10px;letter-spacing:.08em;cursor:pointer
}
@media(max-width:430px){
  #header{gap:20px}
  #sub{letter-spacing:.22em}
  #actorPos{width:min(58vw,252px)}
  #reaction{top:29%;right:6%;width:min(25vw,106px);border-radius:24px}
}
</style>
</head>
<body>
<main id="stage">
  <div id="header">
    <div id="logo">ASA</div>
    <div id="sub">30 SECOND MOTION</div>
  </div>

  <div id="actorPos">
    <div id="actorPhysics">
      <div id="actorBreathe">
        <img id="actor" src="assets/idle.png" alt="ASA">
      </div>
    </div>
  </div>

  <div id="shadow"></div>

  <div id="reaction">
    <img id="reactionImg" alt="">
  </div>

  <div id="fx"></div>
  <div class="floor"></div>
  <div id="caption">READY...</div>
  <button id="replay" type="button">↻ REPLAY</button>
</main>

<script>
const stage=document.querySelector("#stage");
const pos=document.querySelector("#actorPos");
const physics=document.querySelector("#actorPhysics");
const breathe=document.querySelector("#actorBreathe");
const actor=document.querySelector("#actor");
const shadow=document.querySelector("#shadow");
const caption=document.querySelector("#caption");
const logo=document.querySelector("#logo");
const sub=document.querySelector("#sub");
const fx=document.querySelector("#fx");
const reaction=document.querySelector("#reaction");
const reactionImg=document.querySelector("#reactionImg");

const IMG={
  idle:"assets/idle.png",
  smile:"assets/smile.png",
  wink:"assets/wink.png",
  wave:"assets/wave.png",
  heart:"assets/heart.png",
  dance1:"assets/dance1.png",
  dance2:"assets/dance2.png",
  dance3:"assets/dance3.png",
  kiss:"assets/kiss.png",
  seriousFace:"assets/serious-face.png",
  charmFace:"assets/charm-face.png"
};

Object.values(IMG).forEach(src=>{const i=new Image();i.src=src});

let timers=[];
let danceTimer=null;
let animations=[];

function later(ms,fn){
  const id=setTimeout(fn,ms);timers.push(id);return id
}
function stopAll(){
  timers.forEach(clearTimeout);timers=[];
  if(danceTimer){clearInterval(danceTimer);danceTimer=null}
  animations.forEach(a=>{try{a.cancel()}catch(e){}});
  animations=[]
}
function anim(el,frames,opts){
  const a=el.animate(frames,{fill:"forwards",...opts});
  animations.push(a);return a
}
function show(name){actor.src=IMG[name]}
function say(text){
  caption.style.opacity="0";caption.style.transform="translateY(3px)";
  later(90,()=>{
    caption.textContent=text;
    caption.style.opacity="1";caption.style.transform="translateY(0)"
  })
}
function hideReaction(){
  reaction.classList.remove("show");
  reaction.style.opacity="0"
}
function showReaction(src){
  reactionImg.src=src;
  reaction.style.opacity="";
  reaction.classList.remove("show");
  void reaction.offsetWidth;
  reaction.classList.add("show")
}
function sideFx(symbol,count=3,side="right",low=false){
  for(let i=0;i<count;i++)later(i*150,()=>{
    const e=document.createElement("span");
    e.className="fx";e.textContent=symbol;
    const left=side==="left"||(side==="both"&&i%2===0);
    e.style.left=left?(9+Math.random()*10)+"%":(81+Math.random()*9)+"%";
    e.style.top=(low?68:48)+Math.random()*(low?8:15)+"%";
    fx.appendChild(e);setTimeout(()=>e.remove(),1600)
  })
}
function stepDust(direction=1){
  for(let i=0;i<4;i++){
    const d=document.createElement("span");
    d.className="stepDot";
    d.style.left=(47+Math.random()*7)+"%";
    d.style.top=(80+Math.random()*2)+"%";
    d.style.setProperty("--dx",(direction*(8+Math.random()*13))+"px");
    d.style.setProperty("--dy",(-4-Math.random()*9)+"px");
    fx.appendChild(d);setTimeout(()=>d.remove(),760)
  }
}

/* One polished pose change: crouch -> image swap -> spring -> tiny settle.
   Because this happens on the physics layer, breathing never gets interrupted. */
function pose(name,{hop=0,tilt=0,fxSymbol=null,fxSide="right"}={}){
  const down=anim(physics,[
    {transform:"translateY(0) scale(1) rotate(0deg)"},
    {transform:`translateY(4px) scale(1.026,.972) rotate(${tilt*.35}deg)`}
  ],{duration:125,easing:"ease-out"});

  later(112,()=>{
    show(name);
    if(hop>0){
      anim(shadow,[
        {transform:"translateX(-50%) scale(1)",opacity:.88},
        {transform:"translateX(-50%) scale(.72,.76)",opacity:.48,offset:.34},
        {transform:"translateX(-50%) scale(1.07,1.02)",opacity:.96,offset:.78},
        {transform:"translateX(-50%) scale(1)",opacity:.88}
      ],{duration:520,easing:"ease-out"})
    }
    anim(physics,[
      {transform:`translateY(4px) scale(1.026,.972) rotate(${tilt*.35}deg)`},
      {transform:`translateY(${-hop}px) scale(.977,1.035) rotate(${tilt}deg)`,offset:.42},
      {transform:`translateY(1px) scale(1.012,.99) rotate(${-tilt*.25}deg)`,offset:.76},
      {transform:"translateY(0) scale(1) rotate(0deg)"}
    ],{duration:480,easing:"cubic-bezier(.2,.8,.2,1)"});
    if(fxSymbol)sideFx(fxSymbol,3,fxSide)
  })
}

/* Full little-body "attention" beat. Tiny, not a camera zoom. */
function attention(direction=1){
  anim(physics,[
    {transform:"translateX(0) rotate(0)"},
    {transform:`translateX(${direction*5}px) rotate(${direction*2.2}deg)`,offset:.35},
    {transform:`translateX(${-direction*2}px) rotate(${-direction*.8}deg)`,offset:.72},
    {transform:"translateX(0) rotate(0)"}
  ],{duration:610,easing:"ease-in-out"})
}

function dance(){
  const poses=["dance1","dance2","dance3","dance2"];
  const x=[-7,7,-3,5];
  const r=[-3.5,3,-2,2.5];
  let i=0;

  function beat(){
    const next=i%poses.length;
    /* compress exactly at swap point, making the static-frame change feel like a step */
    anim(physics,[
      {transform:"translate(0,0) rotate(0) scale(1)"},
      {transform:`translate(${x[next]*.3}px,3px) rotate(${r[next]*.25}deg) scale(1.025,.975)`,offset:.22},
      {transform:`translate(${x[next]}px,-5px) rotate(${r[next]}deg) scale(.988,1.018)`,offset:.52},
      {transform:`translate(${x[next]*.55}px,0) rotate(${r[next]*.45}deg) scale(1.006,.996)`,offset:.78},
      {transform:"translate(0,0) rotate(0) scale(1)"}
    ],{duration:850,easing:"cubic-bezier(.25,.72,.25,1)"});

    later(175,()=>show(poses[next]));
    later(190,()=>stepDust(x[next] >= 0 ? 1 : -1));

    anim(shadow,[
      {transform:"translateX(-50%) scale(1)",opacity:.88},
      {transform:`translateX(calc(-50% + ${x[next]*.45}px)) scale(.9,.82)`,opacity:.66,offset:.45},
      {transform:"translateX(-50%) scale(1.02,.96)",opacity:.9}
    ],{duration:850,easing:"ease-in-out"});

    i++
  }

  beat();
  danceTimer=setInterval(beat,920)
}

function reset(){
  stopAll();
  fx.innerHTML="";
  hideReaction();
  show("idle");
  pos.style.transition="none";pos.style.left="-45%";
  physics.getAnimations().forEach(a=>a.cancel());
  shadow.getAnimations().forEach(a=>a.cancel());
  physics.style.transform="";
  shadow.style.transform="";
  shadow.style.opacity="";
  stage.style.opacity="1";
  logo.style.opacity="0";logo.style.transform="translateY(-8px)";
  sub.style.opacity="0";sub.textContent="30 SECOND MOTION";
  caption.textContent="READY...";caption.style.opacity="1";caption.style.transform="none"
}

function run(){
  reset();

  /* 0.0 - 1.8: entrance with a real little step cadence */
  say("ASA COMES IN");
  pos.style.transition="left 1.78s cubic-bezier(.18,.72,.2,1)";
  requestAnimationFrame(()=>requestAnimationFrame(()=>pos.style.left="29%"));
  anim(physics,[
    {transform:"translateY(0) rotate(-1.5deg)"},
    {transform:"translateY(-5px) rotate(1.5deg)",offset:.25},
    {transform:"translateY(0) rotate(-1deg)",offset:.5},
    {transform:"translateY(-4px) rotate(1deg)",offset:.75},
    {transform:"translateY(0) rotate(0)"}
  ],{duration:1760,easing:"ease-in-out"});
  later(330,()=>stepDust(1));later(780,()=>stepDust(1));later(1230,()=>stepDust(1));

  /* 1.8 - 3.6: settle, tiny recoil instead of hard stop */
  later(1800,()=>{
    show("idle");
    say("HELLO, ASA.");
    logo.style.opacity="1";logo.style.transform="translateY(0)";
    sub.style.opacity="1";
    anim(physics,[
      {transform:"translateX(0)"},
      {transform:"translateX(5px)",offset:.42},
      {transform:"translateX(-2px)",offset:.76},
      {transform:"translateX(0)"}
    ],{duration:520,easing:"ease-out"});
  });

  /* 3.6 - 5.6: smile, small hop */
  later(3600,()=>{
    say("SMILE");
    pose("smile",{hop:9,tilt:-1.2,fxSymbol:"✦",fxSide:"right"});
    later(900,()=>attention(-1))
  });

  /* 5.6 - 7.6: dedicated full-body wink. No missing image, no crop. */
  later(5600,()=>{
    say("WINK!");
    pose("wink",{hop:4,tilt:2,fxSymbol:"♡",fxSide:"left"});
    later(800,()=>attention(1))
  });

  /* 7.6 - 9.8: serious reaction. Main ASA remains full-body and stable. */
  later(7600,()=>{
    say("SERIOUS MODE");
    pose("idle",{hop:0,tilt:0});
    showReaction(IMG.seriousFace);
    later(520,()=>anim(physics,[
      {transform:"translateY(0)"},{transform:"translateY(2px)",offset:.5},{transform:"translateY(0)"}
    ],{duration:800,easing:"ease-in-out"}))
  });

  /* 9.8 - 12.1: charm reaction + coy body tilt */
  later(9800,()=>{
    hideReaction();
    say("COOL & CHARM");
    showReaction(IMG.charmFace);
    pose("idle",{hop:3,tilt:-2,fxSymbol:"✧",fxSide:"right"});
    later(900,()=>attention(-1))
  });

  /* 12.1 - 15.1: wave. Two distinct body beats, not constant shaking. */
  later(12100,()=>{
    hideReaction();
    say("BYE BYE ♡");
    pose("wave",{hop:4,tilt:-1,fxSymbol:"♡",fxSide:"right"});
    later(950,()=>attention(1));
    later(1900,()=>attention(-1))
  });

  /* 15.1 - 18.1: heart. Compress -> pop -> quiet hold, so the pose can be read. */
  later(15100,()=>{
    say("MAKE A HEART");
    pose("heart",{hop:11,tilt:0,fxSymbol:"♥",fxSide:"both"});
    later(1120,()=>anim(physics,[
      {transform:"scale(1)"},{transform:"scale(1.025)",offset:.46},{transform:"scale(1)"}
    ],{duration:720,easing:"ease-in-out"}))
  });

  /* 18.1 - 25.3: dance. Only one ASA image exists at any instant.
     0.92 sec beat gives the pose enough time to look cute instead of frantic. */
  later(18100,()=>{
    say("DANCE MODE");
    dance();
    sideFx("♪",2,"left",true);
    later(2600,()=>sideFx("♪",2,"right",true));
    later(4900,()=>sideFx("♪",2,"left",true))
  });

  /* 25.3 - 28.2: kiss, deliberate anticipation and recoil */
  later(25300,()=>{
    if(danceTimer){clearInterval(danceTimer);danceTimer=null}
    say("KISS ♥");
    pose("kiss",{hop:7,tilt:-1.5,fxSymbol:"♥",fxSide:"left"});
    later(1050,()=>attention(-1))
  });

  /* 28.2 - 30.4: final heart hop */
  later(28200,()=>{
    say("ASA");
    sub.textContent="SEE YOU NEXT TIME";
    pose("heart",{hop:13,tilt:0,fxSymbol:"♥",fxSide:"both"});
    later(900,()=>attention(1))
  });

  later(30400,()=>{
    anim(stage,[{opacity:1},{opacity:0}],{duration:450,easing:"linear"})
  })
}

document.querySelector("#replay").addEventListener("click",run);
run();
</script>
</body>
</html>
