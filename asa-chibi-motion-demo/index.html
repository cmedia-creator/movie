<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fdf7fb">
  <meta name="description" content="平成レトロ・Y2K・CYBER・BABYMON VIBEで作る推しプロフィール">
  <title>推しプロフ</title>
  <link rel="stylesheet" href="./assets/style.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="./">
      <b>♡ 推しプロフ</b>
      <small>MY OSHI PROFILE</small>
    </a>
    <button id="copyTop" class="sub hidden" type="button">URLをコピー</button>
  </header>

  <main class="page">
    <section id="editView">
      <div class="hero">
        <p class="eyebrow">平成のプロフ文化を、推し活へ。</p>
        <h1>好きなものくらい、<em>好き勝手に語ろう。</em></h1>
        <div class="badges">
          <span>無料で作成</span>
          <span>URL共有</span>
          <span>スマホ対応</span>
        </div>
      </div>

      <div class="layout">
        <form id="form" class="panel">
          <div class="formTitle">
            <div>
              <small>PROFILE EDITOR</small>
              <h2>推しプロフをつくる</h2>
            </div>
            <i id="state">未保存</i>
          </div>

          <div class="cols">
            <label>名前 <b>*</b>
              <input id="display_name" maxlength="50" required placeholder="例：さとる">
            </label>
            <label>推し <b>*</b>
              <input id="oshi_name" maxlength="100" required placeholder="例：RUKA">
            </label>
          </div>

          <div class="cols">
            <label>推し歴
              <input id="oshi_since" maxlength="50" placeholder="例：2024年から">
            </label>
            <label>好きな曲
              <input id="favorite_song" maxlength="150" placeholder="例：DRIP">
            </label>
          </div>

          <label>好きなところ
            <textarea id="favorite_point" maxlength="500" rows="3" placeholder="例：ダンス・表情・声・空気感"></textarea>
          </label>

          <label>同担スタンス
            <select id="same_fan_stance">
              <option value="">選択してください</option>
              <option>同担大歓迎 ◎</option>
              <option>同担歓迎 ○</option>
              <option>同担慎重 △</option>
              <option>同担NG ×</option>
              <option>特に気にしない</option>
            </select>
          </label>

          <label>一言
            <input id="status_message" maxlength="200" placeholder="例：RUKAしか勝たん">
          </label>

          <label>自己紹介
            <textarea id="bio" maxlength="2000" rows="5" placeholder="MONSTAGE運営してます。遊びにきてね"></textarea>
          </label>

          <fieldset class="themeBox">
            <legend>テーマ</legend>
            <div class="themes">
              <label><input type="radio" name="theme" value="heisei" checked><span>平成レトロ</span></label>
              <label><input type="radio" name="theme" value="y2k"><span>Y2K</span></label>
              <label><input type="radio" name="theme" value="cyber"><span>CYBER</span></label>
              <label><input type="radio" name="theme" value="babymon"><span>BABYMON VIBE</span></label>
            </div>
          </fieldset>

          <label>公開URL <b>*</b>
            <div class="slug">
              <span>?p=</span>
              <input id="slug" maxlength="30" required placeholder="satoru">
            </div>
            <small>英小文字・数字・_・- / 3〜30文字</small>
          </label>

          <label class="toggle">
            <input id="is_public" type="checkbox" checked>
            <span class="toggleText">プロフィールを公開する</span>
          </label>

          <div id="msg" class="msg hidden"></div>
          <button id="save" class="mainBtn" type="submit">プロフィールを保存 <b>→</b></button>
          <p class="note">初期MVPでは端末内の匿名アカウントに編集権限を保存します。課金導入時に永続アカウントへ移行します。</p>
        </form>

        <aside class="previewArea">
          <div class="previewHead">
            <b>LIVE PREVIEW</b>
            <small>入力内容を即時反映</small>
          </div>
          <div id="preview" class="card theme-heisei"></div>
        </aside>
      </div>
    </section>

    <section id="publicView" class="hidden public">
      <div id="loading" class="loading">プロフィールを読み込み中...</div>
      <div id="notFound" class="hidden center">
        <h1>404</h1>
        <p>このプロフは見つかりません。</p>
        <a href="./">自分の推しプロフを作る</a>
      </div>
      <div id="publicWrap" class="hidden publicWrap">
        <div id="publicCard" class="card"></div>
        <div class="share">
          <span>このプロフを共有</span>
          <button id="copyPublic" class="mainBtn small" type="button">URLをコピー</button>
          <a class="sub" href="./">自分も作る</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <span>推しプロフ / MVP</span>
    <span>好きは、プロフィールになる。</span>
  </footer>

  <script type="module" src="./assets/app.js"></script>
</body>
</html>
