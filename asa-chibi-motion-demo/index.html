<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#08070b" />
  <title>Chibi Motion Demo</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="stage" id="stage" aria-label="自動再生ちびキャラクターモーション">
    <div class="ambient ambient-a"></div>
    <div class="ambient ambient-b"></div>
    <div class="grid"></div>
    <div class="spotlight"></div>

    <header class="brand" aria-hidden="true">
      <span class="brand-kicker">CHIBI MOTION</span>
      <strong>ASA</strong>
    </header>

    <div class="scene-label" id="sceneLabel" aria-hidden="true">
      <span id="sceneType">EXPRESSION</span>
      <strong id="sceneName">READY</strong>
    </div>

    <section class="character-wrap" id="characterWrap">
      <div class="shadow" id="shadow"></div>
      <img class="character character-a is-visible" id="characterA" alt="" />
      <img class="character character-b" id="characterB" alt="" />
      <div class="sparkles" id="sparkles" aria-hidden="true"></div>
      <div class="hearts" id="hearts" aria-hidden="true"></div>
    </section>

    <div class="intro-card" id="introCard" aria-hidden="true">
      <div class="intro-line"></div>
      <p>EXPRESSIONS × MOTIONS</p>
      <strong>48 SECOND SHOWCASE</strong>
    </div>

    <div class="progress" aria-hidden="true"><i id="progressBar"></i></div>
    <button class="replay" id="replay" type="button" aria-label="最初から再生">↻</button>
  </main>
  <script src="./app.js"></script>
</body>
</html>
