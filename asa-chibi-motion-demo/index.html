<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0e">
<title>ASA Motion Demo</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:#08080c;font-family:Arial,"Noto Sans JP",sans-serif;
}
body{display:grid;place-items:center}
#stage{
  position:relative;
  width:min(100vw,56.25svh);
  height:100svh;
  overflow:hidden;
  color:#fff;
  background:
    radial-gradient(circle at 50% 36%, rgba(110,84,110,.34), transparent 38%),
    linear-gradient(180deg,#17121b 0%,#0f0c12 52%,#08080c 100%);
}
#stage::before{
  content:"";position:absolute;inset:0;opacity:.36;
  background:
    linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px),
    linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:30px 30px;
}
#stage::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 50% 55%, transparent 40%, rgba(0,0,0,.62) 100%);
}
#header{
  position:absolute;z-index:10;
  top:max(5.7%, calc(env(safe-area-inset-top) + 16px));
  left:7%;
  display:flex;flex-direction:column;align-items:flex-start;gap:24px;
  pointer-events:none;
}
#logo{
  font-size:clamp(48px,14vw,72px);
  font-weight:900;line-height:.82;letter-spacing:-.08em;
  opacity:0;transform:translateY(-10px);transition:.4s;
}
#sub{
  margin-left:2px;
  font-size:clamp(10px,2.6vw,13px);
  letter-spacing:.28em;line-height:1.15;color:rgba(255,255,255,.72);
  opacity:0;transition:.4s;white-space:nowrap;
}
#actorWrap{
  position:absolute;z-index:5;
  left:-45%;
  bottom:17%;
  width:min(53vw,290px);
  aspect-ratio:1/1;
  transform-origin:50% 88%;
}
#actor{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:contain;object-position:center bottom;
  filter:drop-shadow(0 14px 8px rgba(0,0,0,.55));
  user-select:none;-webkit-user-drag:none;
}
.floor{
  position:absolute;left:8%;right:8%;bottom:16.9%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);
  box-shadow:0 0 26px rgba(255,255,255,.16);
}
#caption{
  position:absolute;left:7%;right:7%;bottom:max(7.4%,calc(env(safe-area-inset-bottom) + 18px));
  text-align:center;z-index:10;
  font-size:clamp(12px,3.6vw,18px);font-weight:900;letter-spacing:.14em;
  text-shadow:0 3px 12px #000;
}
#fx{position:absolute;inset:0;z-index:7;pointer-events:none}
.fx{
  position:absolute;font-size:clamp(18px,4.8vw,26px);opacity:0;
  animation:floatFx 1.55s ease-out forwards;
}
@keyframes floatFx{
  0%{opacity:0;transform:translateY(18px) scale(.65)}
  25%{opacity:.95}
  100%{opacity:0;transform:translateY(-80px) scale(1.08) rotate(10deg)}
}
@keyframes enterBob{
  0%,100%{transform:translateY(0) rotate(-1.5deg)}
  50%{transform:translateY(-6px) rotate(1.5deg)}
}
@keyframes idleBob{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-4px)}
}
@keyframes seriousPulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.03)}
}
@keyframes charmMove{
  0%,100%{transform:rotate(-1.6deg) translateY(0)}
  50%{transform:rotate(1.6deg) translateY(-4px)}
}
@keyframes waveMove{
  0%,100%{transform:rotate(-1deg) translateY(0)}
  50%{transform:rotate(1.6deg) translateY(-3px)}
}
@keyframes heartMove{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.035) translateY(-3px)}
}
@keyframes danceMove{
  0%,100%{transform:translateX(0) translateY(0) rotate(-2deg)}
  25%{transform:translateX(-6px) translateY(-5px) rotate(-4deg)}
  50%{transform:translateX(6px) translateY(0) rotate(3deg)}
  75%{transform:translateX(-3px) translateY(-6px) rotate(-2deg)}
}
@keyframes finalHop{
  0%,100%{transform:scale(1.1) translateY(0)}
  48%{transform:scale(1.1) translateY(-18px)}
  72%{transform:scale(1.12,.98) translateY(1px)}
}
@keyframes stageFade{to{opacity:0}}
#replay{
  position:absolute;top:max(3%,calc(env(safe-area-inset-top) + 8px));right:4%;z-index:12;
  border:1px solid rgba(255,255,255,.26);background:rgba(0,0,0,.34);color:#fff;
  padding:7px 10px;border-radius:999px;font-size:10px;letter-spacing:.08em;cursor:pointer;
}
@media (max-width:430px){
  #header{gap:20px}
  #sub{letter-spacing:.22em}
  #actorWrap{width:min(58vw,250px)}
}
</style>
</head>
<body>
<main id="stage">
  <div id="header">
    <div id="logo">ASA</div>
    <div id="sub">30 SECOND MOTION</div>
  </div>
  <div id="actorWrap"><img id="actor" src="assets/idle.png" alt="ASA"></div>
  <div id="fx"></div>
  <div class="floor"></div>
  <div id="caption">READY...</div>
  <button id="replay" type="button">↻ REPLAY</button>
</main>
<script>
const actor=document.querySelector("#actor");
const wrap=document.querySelector("#actorWrap");
const caption=document.querySelector("#caption");
const logo=document.querySelector("#logo");
const sub=document.querySelector("#sub");
const fx=document.querySelector("#fx");
const stage=document.querySelector("#stage");

const IMG={
  idle:"assets/idle.png",
  smile:"assets/smile.png",
  wink:"assets/wink.png",
  serious:"assets/serious.png",
  charm:"assets/charm.png",
  wave:"assets/wave.png",
  heart:"assets/heart.png",
  dance1:"assets/dance1.png",
  dance2:"assets/dance2.png",
  dance3:"assets/dance3.png",
  kiss:"assets/kiss.png"
};

Object.values(IMG).forEach(src=>{ const i=new Image(); i.src=src; });

let timers=[];
let seqTimer=null;

function later(ms, fn){ timers.push(setTimeout(fn, ms)); }
function clearAll(){
  timers.forEach(clearTimeout); timers=[];
  if(seqTimer){ clearInterval(seqTimer); seqTimer=null; }
}
function show(name){ actor.src = IMG[name]; }
function say(t){ caption.textContent = t; }
function motion(anim){ wrap.style.animation = anim || ""; }
function burst(symbol, count=4, side="right"){
  for(let i=0;i<count;i++){
    later(i*140, ()=>{
      const e=document.createElement("span");
      e.className="fx";
      e.textContent=symbol;
      const left = side==="left" || (side==="both" && i%2===0);
      e.style.left = left ? (10+Math.random()*10)+"%" : (80+Math.random()*10)+"%";
      e.style.top = (48+Math.random()*18)+"%";
      fx.appendChild(e);
      setTimeout(()=>e.remove(), 1600);
    });
  }
}
function cycle(names, interval){
  let i=0;
  show(names[0]);
  if(seqTimer) clearInterval(seqTimer);
  seqTimer = setInterval(()=>{
    i=(i+1)%names.length;
    show(names[i]);
  }, interval);
}
function stopCycle(){
  if(seqTimer){ clearInterval(seqTimer); seqTimer=null; }
}
function reset(){
  clearAll();
  fx.innerHTML="";
  wrap.style.transition="none";
  wrap.style.left="-45%";
  wrap.style.transform="";
  wrap.style.animation="";
  stage.style.animation="";
  stage.style.opacity="1";
  logo.style.opacity="0";
  logo.style.transform="translateY(-10px)";
  sub.style.opacity="0";
  sub.textContent="30 SECOND MOTION";
  show("idle");
  say("READY...");
}
function run(){
  reset();

  // 0.0 - 1.8s
  say("ASA COMES IN");
  motion("enterBob .45s ease-in-out infinite");
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    wrap.style.transition="left 1.75s linear";
    wrap.style.left="29%";
  }));

  // 1.8 - 3.5
  later(1800, ()=>{
    show("idle");
    motion("idleBob 1.2s ease-in-out infinite");
    say("HELLO, ASA.");
    logo.style.opacity="1";
    logo.style.transform="translateY(0)";
    sub.style.opacity="1";
  });

  // 3.5 - 5.5
  later(3500, ()=>{
    show("smile");
    motion("idleBob 1.05s ease-in-out infinite");
    say("SMILE");
    burst("✦",3,"right");
  });

  // 5.5 - 7.4
  later(5500, ()=>{
    show("wink");
    motion("idleBob 1.05s ease-in-out infinite");
    say("WINK!");
    burst("♡",3,"left");
  });

  // 7.4 - 9.3
  later(7400, ()=>{
    show("serious");
    motion("seriousPulse 1.25s ease-in-out infinite");
    say("SERIOUS MODE");
  });

  // 9.3 - 11.3
  later(9300, ()=>{
    show("charm");
    motion("charmMove 1.12s ease-in-out infinite");
    say("COOL & CHARM");
    burst("✧",3,"right");
  });

  // 11.3 - 14.2
  later(11300, ()=>{
    show("wave");
    motion("waveMove 1.35s ease-in-out infinite");
    say("BYE BYE ♡");
  });

  // 14.2 - 17.1
  later(14200, ()=>{
    show("heart");
    motion("heartMove 1.45s ease-in-out infinite");
    say("MAKE A HEART");
    burst("♥",4,"both");
  });

  // 17.1 - 24.1
  later(17100, ()=>{
    cycle(["dance1","dance2","dance3"], 900);
    motion("danceMove 2.7s ease-in-out infinite");
    say("DANCE MODE");
    burst("♪",3,"left");
    later(2800, ()=>burst("♪",3,"right"));
  });

  // 24.1 - 27.1
  later(24100, ()=>{
    stopCycle();
    show("kiss");
    motion("idleBob 1.0s ease-in-out infinite");
    say("KISS ♥");
    burst("♥",4,"left");
  });

  // 27.1 - 29.2
  later(27100, ()=>{
    show("heart");
    motion("finalHop .72s ease-in-out");
    say("ASA");
    sub.textContent="SEE YOU NEXT TIME";
    burst("♥",4,"both");
  });

  // 29.2 - 29.8
  later(29200, ()=>{
    stage.style.animation="stageFade .45s linear forwards";
  });
}
document.querySelector("#replay").addEventListener("click", run);
run();
</script>
</body>
</html>
