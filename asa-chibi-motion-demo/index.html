<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090d">
<title>ASA Motion Demo</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:#08080c;font-family:Arial,"Noto Sans JP",sans-serif
}
body{display:grid;place-items:center}
#stage{
  position:relative;
  width:min(100vw,56.25svh);
  height:100svh;
  overflow:hidden;
  color:#fff;
  background:
    radial-gradient(circle at 50% 38%,rgba(120,89,116,.32) 0,rgba(45,32,45,.22) 31%,transparent 55%),
    linear-gradient(180deg,#17121b 0%,#0e0c12 55%,#07070a 100%);
  isolation:isolate
}
#stage::before{
  content:"";position:absolute;inset:0;opacity:.34;z-index:0;
  background:
    linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px),
    linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:30px 30px
}
#stage::after{
  content:"";position:absolute;inset:0;z-index:9;pointer-events:none;
  background:radial-gradient(circle at 50% 55%,transparent 41%,rgba(0,0,0,.62) 100%)
}
#header{
  position:absolute;z-index:12;
  top:max(5.8%,calc(env(safe-area-inset-top) + 18px));
  left:7%;
  display:flex;flex-direction:column;align-items:flex-start;gap:24px;
  pointer-events:none
}
#logo{
  font-size:clamp(48px,14vw,72px);font-weight:900;line-height:.82;letter-spacing:-.08em;
  opacity:0;transform:translateY(-8px);transition:opacity .38s ease,transform .38s ease
}
#sub{
  margin-left:2px;font-size:clamp(10px,2.6vw,13px);line-height:1.1;
  letter-spacing:.28em;color:rgba(255,255,255,.70);white-space:nowrap;
  opacity:0;transition:opacity .38s ease
}

#actorPos{
  position:absolute;z-index:5;
  left:-45%;bottom:17.1%;
  width:min(54vw,292px);aspect-ratio:1/1;
  transform-origin:50% 90%;
  will-change:left
}
#actorPhysics,#actorBreathe{
  position:absolute;inset:0;
  transform-origin:50% 88%;
  will-change:transform
}
#actorBreathe{ animation:microLife 2.35s ease-in-out infinite }
#actor{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:contain;object-position:center bottom;
  filter:drop-shadow(0 14px 8px rgba(0,0,0,.55));
  user-select:none;-webkit-user-drag:none
}
@keyframes microLife{
  0%,100%{transform:translateY(0) rotate(-.12deg) scale(1)}
  34%{transform:translateY(-1.8px) rotate(.18deg) scale(1.003,.998)}
  67%{transform:translateY(-.2px) rotate(-.18deg) scale(.999,1.002)}
}

#shadow{
  position:absolute;z-index:4;left:50%;bottom:16.72%;
  width:min(23vw,122px);height:min(3.2vw,17px);
  transform:translateX(-50%);
  border-radius:999px;
  background:radial-gradient(ellipse at center,rgba(0,0,0,.48) 0%,rgba(0,0,0,.25) 56%,transparent 82%);
  filter:blur(2px);opacity:.88;
  animation:shadowIdle 2.35s ease-in-out infinite;
  will-change:transform,opacity
}
@keyframes shadowIdle{
  0%,100%{transform:translateX(-50%) scale(1);opacity:.88}
  34%{transform:translateX(-50%) scale(.972,.94);opacity:.79}
  67%{transform:translateX(-50%) scale(.992,.97);opacity:.84}
}

.floor{
  position:absolute;z-index:2;left:8%;right:8%;bottom:16.86%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.42),transparent);
  box-shadow:0 0 27px rgba(255,255,255,.13)
}
#caption{
  position:absolute;z-index:12;left:7%;right:7%;
  bottom:max(7.4%,calc(env(safe-area-inset-bottom) + 18px));
  text-align:center;font-size:clamp(12px,3.6vw,18px);font-weight:900;
  letter-spacing:.14em;text-shadow:0 3px 12px #000;
  transition:opacity .18s ease,transform .18s ease
}

#fx{position:absolute;inset:0;z-index:7;pointer-events:none}
.fx{
  position:absolute;font-size:clamp(16px,4.6vw,25px);opacity:0;
  animation:fxFloat 1.8s cubic-bezier(.15,.72,.32,1) forwards
}
@keyframes fxFloat{
  0%{opacity:0;transform:translateY(12px) scale(.65)}
  22%{opacity:.92}
  100%{opacity:0;transform:translateY(-58px) scale(1.04) rotate(7deg)}
}
.stepDot{
  position:absolute;width:5px;height:5px;border-radius:50%;
  background:rgba(255,255,255,.56);filter:blur(.2px);
  opacity:0;animation:stepDust .9s ease-out forwards
}
@keyframes stepDust{
  0%{opacity:.6;transform:translate(0,0) scale(.7)}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.15)}
}

#replay{
  position:absolute;z-index:15;
  top:max(3%,calc(env(safe-area-inset-top) + 8px));right:4%;
  border:1px solid rgba(255,255,255,.24);background:rgba(0,0,0,.34);color:#fff;
  padding:7px 10px;border-radius:999px;font-size:10px;letter-spacing:.08em;cursor:pointer
}
@media(max-width:430px){
  #header{gap:20px}
  #sub{letter-spacing:.22em}
  #actorPos{width:min(58vw,252px)}
}
</style>
</head>
<body>
<main id="stage">
  <div id="header">
    <div id="logo">ASA</div>
    <div id="sub">30 SECOND MOTION</div>
  </div>

  <div id="actorPos">
    <div id="actorPhysics">
      <div id="actorBreathe">
        <img id="actor" src="assets/idle.png" alt="ASA">
      </div>
    </div>
  </div>

  <div id="shadow"></div>
  <div id="fx"></div>
  <div class="floor"></div>
  <div id="caption">READY...</div>
  <button id="replay" type="button">↻ REPLAY</button>
</main>

<script>
const stage=document.querySelector("#stage");
const pos=document.querySelector("#actorPos");
const physics=document.querySelector("#actorPhysics");
const actor=document.querySelector("#actor");
const shadow=document.querySelector("#shadow");
const caption=document.querySelector("#caption");
const logo=document.querySelector("#logo");
const sub=document.querySelector("#sub");
const fx=document.querySelector("#fx");

const IMG={
  idle:"assets/idle.png",
  smile:"assets/smile.png",
  wink:"assets/wink.png",
  wave:"assets/wave.png",
  heart:"assets/heart.png",
  dance1:"assets/dance1.png",
  dance2:"assets/dance2.png",
  dance3:"assets/dance3.png",
  kiss:"assets/kiss.png"
};
Object.values(IMG).forEach(src=>{const i=new Image();i.src=src});

let timers=[];
let danceTimer=null;
let animations=[];

function later(ms,fn){ const id=setTimeout(fn,ms); timers.push(id); return id; }
function stopAll(){
  timers.forEach(clearTimeout); timers=[];
  if(danceTimer){clearInterval(danceTimer); danceTimer=null}
  animations.forEach(a=>{ try{a.cancel()}catch(e){} });
  animations=[];
}
function anim(el,frames,opts){
  const a=el.animate(frames,{fill:"forwards",...opts});
  animations.push(a);
  return a;
}
function show(name){ actor.src=IMG[name]; }
function say(text){
  caption.style.opacity="0"; caption.style.transform="translateY(3px)";
  later(100,()=>{
    caption.textContent=text;
    caption.style.opacity="1"; caption.style.transform="translateY(0)";
  });
}
function sideFx(symbol,count=2,side="right",low=false){
  for(let i=0;i<count;i++) later(i*180,()=>{
    const e=document.createElement("span");
    e.className="fx"; e.textContent=symbol;
    const left=side==="left"||(side==="both"&&i%2===0);
    e.style.left=left?(10+Math.random()*9)+"%":(82+Math.random()*8)+"%";
    e.style.top=(low?69:49)+Math.random()*(low?7:12)+"%";
    fx.appendChild(e); setTimeout(()=>e.remove(),1850);
  });
}
function stepDust(direction=1){
  for(let i=0;i<3;i++){
    const d=document.createElement("span");
    d.className="stepDot";
    d.style.left=(48+Math.random()*5)+"%";
    d.style.top=(80+Math.random()*2)+"%";
    d.style.setProperty("--dx",(direction*(7+Math.random()*10))+"px");
    d.style.setProperty("--dy",(-3-Math.random()*7)+"px");
    fx.appendChild(d); setTimeout(()=>d.remove(),920);
  }
}
function attention(direction=1,duration=860){
  anim(physics,[
    {transform:"translateX(0) rotate(0)"},
    {transform:`translateX(${direction*4}px) rotate(${direction*1.5}deg)`,offset:.38},
    {transform:`translateX(${-direction*1.5}px) rotate(${-direction*.5}deg)`,offset:.74},
    {transform:"translateX(0) rotate(0)"}
  ],{duration,easing:"ease-in-out"});
}

/* Slower, softer pose transition than PASS 2 */
function pose(name,{hop=0,tilt=0,fxSymbol=null,fxSide="right",duration=620}={}){
  anim(physics,[
    {transform:"translateY(0) scale(1) rotate(0deg)"},
    {transform:`translateY(3px) scale(1.018,.982) rotate(${tilt*.22}deg)`,offset:.24},
    {transform:`translateY(${-hop}px) scale(.988,1.016) rotate(${tilt}deg)`,offset:.54},
    {transform:`translateY(1px) scale(1.006,.995) rotate(${-tilt*.18}deg)`,offset:.82},
    {transform:"translateY(0) scale(1) rotate(0deg)"}
  ],{duration,easing:"cubic-bezier(.22,.78,.22,1)"});

  later(145,()=>show(name));

  if(hop>0){
    anim(shadow,[
      {transform:"translateX(-50%) scale(1)",opacity:.88},
      {transform:"translateX(-50%) scale(.82,.84)",opacity:.58,offset:.42},
      {transform:"translateX(-50%) scale(1.04,1.01)",opacity:.93,offset:.82},
      {transform:"translateX(-50%) scale(1)",opacity:.88}
    ],{duration,easing:"ease-out"});
  }
  if(fxSymbol) later(180,()=>sideFx(fxSymbol,2,fxSide));
}

/* Serious and charm now stay in-world with the main actor only. */
function seriousPose(){
  show("idle");
  anim(physics,[
    {transform:"translateY(0) rotate(0) scale(1)"},
    {transform:"translateY(1px) rotate(0) scale(1.008,.992)",offset:.22},
    {transform:"translateY(-2px) rotate(0) scale(1.01)",offset:.56},
    {transform:"translateY(0) rotate(0) scale(1)",offset:1}
  ],{duration:980,easing:"ease-in-out"});
}
function charmPose(){
  pose("wink",{hop:3,tilt:-1.1,duration:760});
  later(820,()=>attention(-1,980));
}

function dance(){
  const poses=["dance1","dance2","dance3","dance2"];
  const x=[-5,5,-2,4];
  const r=[-2.8,2.5,-1.8,2];
  let i=0;

  function beat(){
    const n=i%poses.length;
    anim(physics,[
      {transform:"translate(0,0) rotate(0) scale(1)"},
      {transform:`translate(${x[n]*.22}px,2px) rotate(${r[n]*.18}deg) scale(1.016,.984)`,offset:.24},
      {transform:`translate(${x[n]}px,-3.5px) rotate(${r[n]}deg) scale(.993,1.01)`,offset:.54},
      {transform:`translate(${x[n]*.45}px,0) rotate(${r[n]*.36}deg) scale(1.003,.998)`,offset:.82},
      {transform:"translate(0,0) rotate(0) scale(1)"}
    ],{duration:1000,easing:"cubic-bezier(.24,.72,.24,1)"});

    later(185,()=>show(poses[n]));
    later(210,()=>stepDust(x[n] >= 0 ? 1 : -1));

    anim(shadow,[
      {transform:"translateX(-50%) scale(1)",opacity:.88},
      {transform:`translateX(calc(-50% + ${x[n]*.34}px)) scale(.93,.88)`,opacity:.72,offset:.5},
      {transform:"translateX(-50%) scale(1.01,.98)",opacity:.9}
    ],{duration:1000,easing:"ease-in-out"});

    i++;
  }

  beat();
  danceTimer=setInterval(beat,1150);
}

function reset(){
  stopAll();
  fx.innerHTML="";
  show("idle");
  pos.style.transition="none";
  pos.style.left="-45%";
  physics.getAnimations().forEach(a=>a.cancel());
  shadow.getAnimations().forEach(a=>a.cancel());
  physics.style.transform="";
  shadow.style.transform="";
  shadow.style.opacity="";
  stage.style.opacity="1";
  logo.style.opacity="0"; logo.style.transform="translateY(-8px)";
  sub.style.opacity="0"; sub.textContent="30 SECOND MOTION";
  caption.textContent="READY..."; caption.style.opacity="1"; caption.style.transform="none";
}

function run(){
  reset();

  /* Entrance */
  say("ASA COMES IN");
  pos.style.transition="left 2.0s cubic-bezier(.18,.72,.2,1)";
  requestAnimationFrame(()=>requestAnimationFrame(()=>pos.style.left="29%"));
  anim(physics,[
    {transform:"translateY(0) rotate(-1deg)"},
    {transform:"translateY(-4px) rotate(1deg)",offset:.25},
    {transform:"translateY(0) rotate(-.7deg)",offset:.5},
    {transform:"translateY(-3px) rotate(.8deg)",offset:.75},
    {transform:"translateY(0) rotate(0)"}
  ],{duration:1980,easing:"ease-in-out"});
  later(380,()=>stepDust(1)); later(920,()=>stepDust(1)); later(1460,()=>stepDust(1));

  /* Idle */
  later(2050,()=>{
    show("idle");
    say("HELLO, ASA.");
    logo.style.opacity="1"; logo.style.transform="translateY(0)";
    sub.style.opacity="1";
    attention(1,760);
  });

  /* Smile */
  later(4400,()=>{
    say("SMILE");
    pose("smile",{hop:7,tilt:-.8,duration:760,fxSymbol:"✦",fxSide:"right"});
    later(1080,()=>attention(-1,900));
  });

  /* Wink */
  later(7000,()=>{
    say("WINK!");
    pose("wink",{hop:3,tilt:1.4,duration:760,fxSymbol:"♡",fxSide:"left"});
    later(1160,()=>attention(1,920));
  });

  /* Serious - no popup, no extra ASA */
  later(9650,()=>{
    say("SERIOUS MODE");
    seriousPose();
  });

  /* Charm - still no popup */
  later(12150,()=>{
    say("COOL & CHARM");
    charmPose();
    later(180,()=>sideFx("✧",2,"right"));
  });

  /* Wave */
  later(14900,()=>{
    say("BYE BYE ♡");
    pose("wave",{hop:3,tilt:-.8,duration:780,fxSymbol:"♡",fxSide:"right"});
    later(1300,()=>attention(1,980));
    later(2700,()=>attention(-1,980));
  });

  /* Heart */
  later(18450,()=>{
    say("MAKE A HEART");
    pose("heart",{hop:9,tilt:0,duration:860,fxSymbol:"♥",fxSide:"both"});
    later(1350,()=>anim(physics,[
      {transform:"scale(1)"},
      {transform:"scale(1.018)",offset:.48},
      {transform:"scale(1)"}
    ],{duration:900,easing:"ease-in-out"}));
  });

  /* Dance - slower, more readable */
  later(22100,()=>{
    say("DANCE MODE");
    dance();
    sideFx("♪",2,"left",true);
    later(3000,()=>sideFx("♪",2,"right",true));
    later(6000,()=>sideFx("♪",2,"left",true));
  });

  /* Kiss */
  later(30200,()=>{
    if(danceTimer){ clearInterval(danceTimer); danceTimer=null; }
    say("KISS ♥");
    pose("kiss",{hop:5,tilt:-1.1,duration:820,fxSymbol:"♥",fxSide:"left"});
    later(1180,()=>attention(-1,980));
  });

  /* Final */
  later(33450,()=>{
    say("ASA");
    sub.textContent="SEE YOU NEXT TIME";
    pose("heart",{hop:10,tilt:0,duration:900,fxSymbol:"♥",fxSide:"both"});
    later(1150,()=>attention(1,980));
  });

  later(36500,()=>{
    anim(stage,[{opacity:1},{opacity:0}],{duration:500,easing:"linear"});
  });
}
document.querySelector("#replay").addEventListener("click",run);
run();
</script>
</body>
</html>
