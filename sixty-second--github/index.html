<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0c11">
<title>60 SECOND LIFE</title>
<style>
:root{
  --ink:#101216;
  --white:#f8f8f5;
  --shadow:0 8px 30px rgba(0,0,0,.18);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a0c11;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
button{font:inherit}
#app{position:relative;width:100%;height:100dvh;overflow:hidden;background:#0a0c11}
.screen{position:absolute;inset:0;transition:opacity .8s ease,transform .8s ease}
.hidden{opacity:0;pointer-events:none;transform:scale(1.015)}
.phrase{white-space:nowrap}

/* Intro / End */
.intro,.end{
  display:flex;align-items:flex-end;padding:9vw;color:#fff;
  background:
    radial-gradient(circle at 72% 22%,rgba(89,99,124,.38) 0 11%,transparent 38%),
    linear-gradient(180deg,#171a22 0%,#090b10 62%,#060709 100%);
}
.box{width:100%;padding-bottom:max(8vh,env(safe-area-inset-bottom))}
.kicker{font-size:12px;letter-spacing:.24em;opacity:.56;margin-bottom:17px}
h1,h2{font-size:clamp(36px,10vw,58px);line-height:1.2;margin:0 0 20px;letter-spacing:-.045em}
.copy{font-size:clamp(16px,4.6vw,22px);line-height:1.82;opacity:.78;margin:0 0 26px}
.start,.replay{border:0;border-radius:999px;padding:14px 28px;font-weight:850;font-size:17px;background:#fff;color:#111;box-shadow:var(--shadow)}
.replay{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.38);box-shadow:none}

/* Film world */
#film{background:#cfd3d6;color:var(--ink)}
.sky{position:absolute;inset:0 0 31%;background:linear-gradient(#bcc1c5,#e4e5e5);transition:background 1.4s ease,filter 1.4s ease}
.sun{position:absolute;right:12%;top:10%;width:19vw;height:19vw;max-width:118px;max-height:118px;border-radius:50%;background:#fbfbf7;opacity:.58;filter:blur(1px)}
.hills{position:absolute;left:-8%;right:-8%;bottom:29%;height:22%;opacity:.5;background:
linear-gradient(150deg,transparent 0 13%,#72777a 13% 25%,transparent 25% 34%,#62676a 34% 50%,transparent 50% 58%,#7c8184 58% 73%,transparent 73%)}
.world{position:absolute;left:0;right:0;bottom:0;height:35%;background:#777c7e;transition:background 1.4s ease}
.road{position:absolute;left:-10%;right:-10%;bottom:12%;height:24%;background:#4b4e50;transform:skewX(-8deg);transition:background 1.4s ease}
.roadline{position:absolute;left:-10%;right:-10%;bottom:23%;height:3px;background:rgba(255,255,255,.35)}

.scene-hero .sky{background:linear-gradient(#86c7e9,#f1d6a6)}
.scene-hero .world{background:#759863}.scene-hero .road{background:#66625d}
.scene-soccer .sky{background:linear-gradient(#73c6f3,#cfeaf6)}
.scene-soccer .world{background:#4c9a52}.scene-soccer .road{background:#5a5f63}
.scene-script .sky{background:linear-gradient(#a89ac9,#f0d4c4)}
.scene-script .world{background:#6f7e63}
.scene-wife .sky{background:linear-gradient(#efb2aa,#f7d9b3)}
.scene-wife .world{background:#748b63}.scene-wife .road{background:#6b625d}

/* Text */
.chapter{position:absolute;z-index:30;left:7vw;top:max(7vh,env(safe-area-inset-top));width:86vw;text-shadow:0 2px 12px rgba(255,255,255,.55)}
.no{font-size:11px;letter-spacing:.23em;font-weight:850;opacity:.55}
.title{font-size:clamp(29px,8vw,48px);font-weight:950;line-height:1.2;letter-spacing:-.04em;margin-top:8px;max-width:95%}
.sub{font-size:clamp(14px,4vw,20px);font-weight:700;line-height:1.72;margin-top:12px;max-width:92%;opacity:.72}

/* Characters */
.person{position:absolute;z-index:20;bottom:23%;left:27%;transform:translateX(-50%);transition:left 1.8s ease,right 1.8s ease,opacity .7s ease,transform .7s ease}
.person.walk{animation:bob .44s steps(2,end) infinite}
@keyframes bob{50%{margin-bottom:5px}}
.body{position:relative;margin:auto}
.head{position:absolute;background:#d8ae89;border:3px solid #252525;border-radius:44%;z-index:2}
.hair{position:absolute;background:#292929;border-radius:50% 50% 34% 34%;z-index:3}
.torso{position:absolute;border:3px solid #242424;z-index:1}
.leg{position:absolute;background:#333;border:3px solid #222}

.baby .body{width:52px;height:61px}
.baby .head{left:10px;top:0;width:32px;height:31px;background:#ddd}
.baby .hair{display:none}
.baby .torso{left:7px;top:28px;width:38px;height:26px;background:#eee;border-radius:10px}
.baby .leg{top:50px;width:17px;height:10px;background:#ddd}.baby .leg.l{left:2px}.baby .leg.r{right:2px}

.child .body{width:58px;height:96px}
.child .head{left:14px;top:0;width:32px;height:34px}.child .hair{left:13px;top:-2px;width:34px;height:16px}
.child .torso{left:11px;top:33px;width:39px;height:39px;background:#ececec}
.child .leg{top:69px;width:14px;height:27px}.child .leg.l{left:12px}.child .leg.r{right:9px}

.boy .body{width:61px;height:108px}
.boy .head{left:14px;top:0;width:34px;height:36px}.boy .hair{left:13px;top:-2px;width:36px;height:17px}
.boy .torso{left:9px;top:35px;width:45px;height:44px;background:#2765a4}
.boy .leg{top:76px;width:15px;height:32px}.boy .leg.l{left:11px}.boy .leg.r{right:8px}

.adult .body,.wife .body{width:66px;height:124px}
.adult .head,.wife .head{left:15px;top:0;width:36px;height:39px}
.adult .hair{left:14px;top:-2px;width:38px;height:18px}
.adult .torso{left:9px;top:38px;width:49px;height:50px;background:#34404d}
.adult .leg,.wife .leg{top:85px;width:16px;height:38px}.adult .leg.l,.wife .leg.l{left:11px}.adult .leg.r,.wife .leg.r{right:9px}

.wife{left:auto;right:16%;transform:translateX(50%);opacity:0}
.wife.show{opacity:1}
.wife.walk{animation:wifebob .44s steps(2,end) infinite}
@keyframes wifebob{50%{margin-bottom:5px}}
.wife .hair{left:11px;top:-3px;width:44px;height:45px;background:#2b2424}
.wife .head{z-index:2}
.wife .torso{left:9px;top:38px;width:49px;height:50px;background:#8d5367}

/* Hero silhouette */
.giant{position:absolute;z-index:7;right:7%;bottom:29%;width:27vw;height:49vh;max-height:430px;opacity:0;transform:translateY(24px) scale(.97);transition:opacity 1.1s ease,transform 1.1s ease}
.giant.show{opacity:.3;transform:none}
.ghead{position:absolute;top:0;left:29%;width:42%;aspect-ratio:.84;border-radius:48% 48% 40% 40%;background:linear-gradient(90deg,#ddd 0 43%,#a32430 43% 57%,#ddd 57%)}
.gbody{position:absolute;top:17%;left:7%;width:86%;height:76%;clip-path:polygon(29% 0,71% 0,100% 28%,80% 100%,20% 100%,0 28%);background:linear-gradient(90deg,#d4d4d4 0 34%,#a32430 34% 47%,#ddd 47% 57%,#a32430 57% 70%,#d4d4d4 70%)}
.eye{position:absolute;top:8%;width:18%;height:5%;background:#fff6b1;box-shadow:0 0 12px #fff2a2}.eye.l{left:27%;transform:rotate(8deg)}.eye.r{right:27%;transform:rotate(-8deg)}
.glow{position:absolute;z-index:5;right:2%;top:6%;width:58vw;height:58vw;border-radius:50%;background:radial-gradient(circle,rgba(255,246,170,.66),rgba(255,246,170,0) 66%);opacity:0;transition:opacity 1s}.glow.show{opacity:1}

/* Soccer */
.ball{position:absolute;z-index:16;left:68%;bottom:24%;width:44px;height:44px;border-radius:50%;opacity:0;background:radial-gradient(circle at 35% 35%,#fff 0 27%,#222 28% 38%,#fff 39% 61%,#222 62% 72%,#eee 73%);transition:opacity .45s}
.ball.show{opacity:1;animation:bounce .75s ease-in-out infinite alternate}
@keyframes bounce{to{transform:translateY(-15px) rotate(28deg)}}
.goal{position:absolute;z-index:4;right:3%;bottom:30%;width:30vw;height:18vh;border:4px solid rgba(255,255,255,.78);border-bottom:0;opacity:0;transition:opacity .7s}
.goal:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 13px,rgba(255,255,255,.2) 14px 15px),repeating-linear-gradient(0deg,transparent 0 13px,rgba(255,255,255,.2) 14px 15px)}
.goal.show{opacity:.72}

/* Script scene */
.choices{position:absolute;z-index:14;right:5%;bottom:35%;width:45%;display:grid;gap:8px;opacity:0;transform:translateY(12px);transition:opacity .7s,transform .7s}
.choices.show{opacity:1;transform:none}
.choice{position:relative;padding:10px 12px;border:2px solid rgba(20,20,20,.7);background:rgba(255,255,255,.88);font-size:12px;font-weight:850;border-radius:5px;overflow:hidden;transition:background .28s,color .28s,transform .28s}
.choice.selected{background:#17191e;color:#fff;transform:scale(1.03)}
.choice.selected:after{content:"";position:absolute;inset:0;border:2px solid rgba(255,255,255,.7);border-radius:4px}
.cursor{position:absolute;left:-22px;top:50%;transform:translateY(-50%);opacity:0;transition:opacity .25s,left .25s}.selected .cursor{opacity:1;left:4px}
.paper{position:absolute;z-index:6;width:26px;height:36px;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);opacity:0}
.paper.show{opacity:.72;animation:fall 4.2s linear infinite}
@keyframes fall{from{transform:translateY(-18vh) rotate(0)}to{transform:translateY(74vh) rotate(310deg)}}
.branch{position:absolute;z-index:3;left:43%;bottom:17%;width:45%;height:12%;opacity:0;transition:opacity .7s}
.branch:before,.branch:after{content:"";position:absolute;left:0;bottom:0;width:85%;height:18px;background:#5c5d5d;transform-origin:left center}
.branch:before{transform:rotate(-18deg)}.branch:after{transform:rotate(18deg)}
.branch.show{opacity:.85}

/* Ending motion */
.spark{position:absolute;z-index:10;border-radius:50%;background:#fff;opacity:0;box-shadow:0 0 12px #fff7bd}
.spark.show{animation:spark 2.6s ease-out forwards}
@keyframes spark{0%{opacity:0;transform:scale(.4)}25%{opacity:.9}100%{opacity:0;transform:translateY(-90px) scale(1.2)}}
.progress{position:absolute;z-index:50;left:0;right:0;bottom:0;height:4px;background:rgba(0,0,0,.12)}
.progress i{display:block;width:0;height:100%;background:#fff;mix-blend-mode:difference}
.end{background:linear-gradient(180deg,#11141b,#08090c 70%);color:#fff}

@media(max-height:680px){
  .chapter{top:5vh}.title{font-size:29px}.sub{font-size:14px}.person{bottom:21%}.giant{height:42vh}
}
</style>
</head>
<body>
<div id="app">

<section id="intro" class="screen intro">
  <div class="box">
    <div class="kicker">60 SECOND LIFE</div>
    <h1><span class="phrase">好きなものが、</span><br><span class="phrase">私をつくった。</span></h1>
    <p class="copy"><span class="phrase">好きなものに出会うたび、</span><br><span class="phrase">人生は少しずつ変わっていった。</span></p>
    <button id="start" class="start">START</button>
  </div>
</section>

<section id="film" class="screen hidden">
  <div class="sky"><div class="sun"></div></div>
  <div class="glow" id="glow"></div>
  <div class="hills"></div><div class="world"></div><div class="road"></div><div class="roadline"></div>
  <div id="chapter" class="chapter"></div>

  <div id="giant" class="giant">
    <div class="gbody"></div><div class="ghead"></div><div class="eye l"></div><div class="eye r"></div>
  </div>

  <div id="goal" class="goal"></div>
  <div id="ball" class="ball"></div>

  <div id="choices" class="choices">
    <div class="choice"><span class="cursor">▶</span>「行く」</div>
    <div class="choice"><span class="cursor">▶</span>「戻る」</div>
    <div class="choice" id="continueChoice"><span class="cursor">▶</span>「続ける」</div>
  </div>

  <div id="branch" class="branch"></div>
  <div class="paper" id="p1" style="left:58%;animation-delay:.1s"></div>
  <div class="paper" id="p2" style="left:72%;animation-delay:1.2s"></div>
  <div class="paper" id="p3" style="left:84%;animation-delay:2.1s"></div>

  <div id="player" class="person baby walk">
    <div class="body"><div class="hair"></div><div class="head"></div><div class="torso"></div><div class="leg l"></div><div class="leg r"></div></div>
  </div>

  <div id="wife" class="person wife">
    <div class="body"><div class="hair"></div><div class="head"></div><div class="torso"></div><div class="leg l"></div><div class="leg r"></div></div>
  </div>

  <div class="spark" id="s1" style="left:30%;bottom:31%;width:7px;height:7px"></div>
  <div class="spark" id="s2" style="left:49%;bottom:34%;width:5px;height:5px"></div>
  <div class="spark" id="s3" style="left:66%;bottom:30%;width:8px;height:8px"></div>
  <div class="progress"><i id="bar"></i></div>
</section>

<section id="end" class="screen end hidden">
  <div class="box">
    <div class="kicker">EPILOGUE</div>
    <h2><span class="phrase">好きなものに出会うたび、</span><br><span class="phrase">私は少しずつ、</span><br><span class="phrase">私になった。</span></h2>
    <p class="copy"><span class="phrase">そして今も、</span><br><span class="phrase">人生の途中。</span></p>
    <button id="replay" class="replay">REPLAY</button>
  </div>
</section>

</div>
<script>
const $=s=>document.querySelector(s);
const intro=$("#intro"),film=$("#film"),end=$("#end"),player=$("#player"),wife=$("#wife"),chapter=$("#chapter");
const giant=$("#giant"),glow=$("#glow"),ball=$("#ball"),goal=$("#goal"),choices=$("#choices"),continueChoice=$("#continueChoice"),branch=$("#branch"),bar=$("#bar");
const papers=["#p1","#p2","#p3"].map($),sparks=["#s1","#s2","#s3"].map($);
let timers=[],raf=null;

function text(no,title,sub){
  chapter.innerHTML=`<div class="no">${no}</div><div class="title">${title}</div><div class="sub">${sub}</div>`;
}
function bodyMarkup(){
  return '<div class="body"><div class="hair"></div><div class="head"></div><div class="torso"></div><div class="leg l"></div><div class="leg r"></div></div>';
}
function age(type){
  player.className="person "+type+" walk";
  player.innerHTML=bodyMarkup();
}
function at(ms,fn){timers.push(setTimeout(fn,ms))}
function cleanClasses(){
  film.className="screen hidden";
  giant.classList.remove("show");glow.classList.remove("show");ball.classList.remove("show");goal.classList.remove("show");
  choices.classList.remove("show");continueChoice.classList.remove("selected");branch.classList.remove("show");
  papers.forEach(x=>x.classList.remove("show"));wife.classList.remove("show","walk");sparks.forEach(x=>x.classList.remove("show"));
  player.style.left="27%";wife.style.right="16%";bar.style.width="0";chapter.innerHTML="";age("baby");
}
function reset(){
  timers.forEach(clearTimeout);timers=[];cancelAnimationFrame(raf);
  cleanClasses();end.classList.add("hidden");intro.classList.remove("hidden");
}
function play(){
  intro.classList.add("hidden");end.classList.add("hidden");film.classList.remove("hidden");
  const total=60000, start=performance.now();
  const tick=(now)=>{
    bar.style.width=Math.min(100,(now-start)/total*100)+"%";
    if(now-start<total) raf=requestAnimationFrame(tick);
  };
  raf=requestAnimationFrame(tick);

  // 0-7s
  text("PROLOGUE",
    '<span class="phrase">まだ、何者でもなかった。</span>',
    '<span class="phrase">ただ、まっすぐな道を進んでいた。</span>'
  );

  // 7-18s: hero / baby -> child
  at(7000,()=>{
    film.classList.add("scene-hero");
    age("child"); giant.classList.add("show"); glow.classList.add("show");
    text("CHAPTER 01",
      '<span class="phrase">はじめて、憧れた。</span>',
      '<span class="phrase">大きくて、強くて、</span><br><span class="phrase">誰かを守るヒーロー。</span>'
    );
  });
  at(15000,()=>{
    text("CHAPTER 01",
      '<span class="phrase">「こんなふうに、</span><br><span class="phrase">なれたらいいな。」</span>',
      '<span class="phrase">それが、最初の「好き」だった。</span>'
    );
  });

  // 18-30s: soccer / child -> boy
  at(18000,()=>{
    giant.classList.remove("show");glow.classList.remove("show");
    film.classList.remove("scene-hero");film.classList.add("scene-soccer");
    age("boy");ball.classList.add("show");goal.classList.add("show");
    text("CHAPTER 02",
      '<span class="phrase">次に、夢中になった。</span>',
      '<span class="phrase">ボールを追いかけるだけで、</span><br><span class="phrase">一日があっという間だった。</span>'
    );
  });
  at(26500,()=>{
    text("CHAPTER 02",
      '<span class="phrase">走って、転んで、</span><br><span class="phrase">また追いかけた。</span>',
      '<span class="phrase">好きなものは、</span><br><span class="phrase">身体まで前に進ませた。</span>'
    );
  });

  // 30-44s: script / boy -> adult
  at(30000,()=>{
    ball.classList.remove("show");goal.classList.remove("show");
    film.classList.remove("scene-soccer");film.classList.add("scene-script");
    age("adult");papers.forEach(x=>x.classList.add("show"));branch.classList.add("show");choices.classList.add("show");
    text("CHAPTER 03",
      '<span class="phrase">やがて、物語を書くようになった。</span>',
      '<span class="phrase">ゲームシナリオを考える時間が、</span><br><span class="phrase">たまらなく楽しかった。</span>'
    );

    // 3 seconds after choices appear, auto-select "続ける"
    at(3000,()=>{
      continueChoice.classList.add("selected");
    });
    // then continue automatically
    at(4300,()=>{
      text("CHAPTER 03",
        '<span class="phrase">選択肢の先に、</span><br><span class="phrase">世界をつくれると知った。</span>',
        '<span class="phrase">憧れるだけじゃなく、</span><br><span class="phrase">自分で物語を生み出す側へ。</span>'
      );
    });
  });

  // 44-56s: wife
  at(44000,()=>{
    choices.classList.remove("show");papers.forEach(x=>x.classList.remove("show"));branch.classList.remove("show");
    film.classList.remove("scene-script");film.classList.add("scene-wife");
    wife.classList.add("show");
    text("CHAPTER 04",
      '<span class="phrase">そして、出会った。</span>',
      '<span class="phrase">一緒に歩いていきたい人に。</span>'
    );
  });
  at(49000,()=>{
    player.style.left="39%";wife.style.right="29%";wife.classList.add("walk");
    text("CHAPTER 04",
      '<span class="phrase">一人だった道を、</span><br><span class="phrase">今は二人で歩いている。</span>',
      '<span class="phrase">好きなものだけじゃない。</span><br><span class="phrase">大切な人も、私をつくっていく。</span>'
    );
    sparks.forEach((x,i)=>setTimeout(()=>x.classList.add("show"),i*350));
  });

  // 56-60s: close
  at(56000,()=>{
    text("EPILOGUE",
      '<span class="phrase">好きなものに出会うたび、</span><br><span class="phrase">私は少しずつ、私になった。</span>',
      '<span class="phrase">そして今も、人生の途中。</span>'
    );
  });
  at(60000,()=>{
    film.classList.add("hidden");end.classList.remove("hidden");
  });
}
$("#start").addEventListener("click",play);
$("#replay").addEventListener("click",()=>{reset();setTimeout(play,350)});
</script>
</body>
</html>
