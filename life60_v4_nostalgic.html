<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#6f5a47">
<title>60 SECOND LIFE</title>
<style>
:root{--safe-top:max(18px,env(safe-area-inset-top));--safe-bottom:max(14px,env(safe-area-inset-bottom))}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050608;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
button{font:inherit}
#app{position:fixed;inset:0;width:100vw;height:100dvh;overflow:hidden;background:#15171b;isolation:isolate}

/* WORLD */
.world{position:absolute;left:0;right:0;top:30%;bottom:0;z-index:1;overflow:hidden}
#sky{position:absolute;inset:0 0 43%;background:linear-gradient(#22262d,#5a5d63);transition:background 1.4s ease}
#sun{position:absolute;width:64px;height:64px;border-radius:50%;top:10%;right:11%;background:#d7d7d7;opacity:.28;transition:1.4s ease}
#mountains{position:absolute;left:-10%;right:-10%;bottom:40%;height:29%;background:#3a3d43;clip-path:polygon(0 100%,10% 65%,22% 80%,37% 27%,53% 76%,68% 43%,82% 72%,100% 42%,100% 100%);transition:background 1.4s ease}
#ground{position:absolute;inset:55% 0 0;background:#32343a;transition:background 1.4s ease}
#road{position:absolute;left:50%;bottom:-9%;width:138%;height:54%;transform:translateX(-50%);background:#565960;clip-path:polygon(42% 0,58% 0,79% 100%,21% 100%);transition:background 1.4s ease}
#road:after{content:"";position:absolute;left:49.4%;top:0;width:1.2%;height:100%;background:repeating-linear-gradient(to bottom,#eee 0 24px,transparent 24px 48px);opacity:.26}

/* special scene layers */
.scene-layer{position:absolute;inset:0;opacity:0;transition:opacity 1s ease;pointer-events:none}
#heroBeam{background:radial-gradient(ellipse at 50% 27%,rgba(255,255,255,.78),rgba(255,255,255,0) 27%)}
#giant{position:absolute;left:50%;top:8%;width:96px;height:195px;transform:translateX(-50%);filter:drop-shadow(0 0 20px rgba(255,92,82,.62))}
#giant .head{position:absolute;left:31px;top:0;width:34px;height:38px;background:#e7e7e7;border-radius:50% 50% 42% 42%}
#giant .body{position:absolute;left:21px;top:34px;width:54px;height:102px;background:linear-gradient(90deg,#ddd 0 31%,#d84d47 31% 69%,#ddd 69%);clip-path:polygon(18% 0,82% 0,100% 20%,76% 100%,24% 100%,0 20%)}
#giant .arm{position:absolute;top:44px;width:16px;height:94px;background:#ddd;border-radius:12px;transform-origin:top}.ga1{left:12px;transform:rotate(18deg)}.ga2{right:12px;transform:rotate(-18deg)}
#stadium .field{position:absolute;left:6%;right:6%;bottom:7%;height:31%;border:4px solid rgba(255,255,255,.8);border-radius:48%;background:repeating-linear-gradient(90deg,#2f9d50 0 32px,#35a857 32px 64px)}
#stadium .goal{position:absolute;right:10%;bottom:18%;width:27%;height:15%;border:4px solid #fff;border-bottom:none}
#ball{position:absolute;width:34px;height:34px;border-radius:50%;background:#f6f6f6;left:82%;bottom:21%;opacity:0;box-shadow:inset 0 0 0 5px #111;transition:transform 4.6s cubic-bezier(.2,.75,.25,1),opacity .35s}
#scriptWorld .paper{position:absolute;padding:10px 14px;border:1px solid rgba(255,255,255,.7);background:rgba(9,10,14,.84);border-radius:10px;font-size:13px;font-weight:800;box-shadow:0 10px 24px #0007}
#scriptWorld .p1{left:7%;top:24%;transform:rotate(-8deg)}#scriptWorld .p2{right:7%;top:29%;transform:rotate(7deg)}#scriptWorld .p3{left:36%;top:18%;transform:rotate(3deg)}
#scriptWorld .branch{position:absolute;left:50%;bottom:17%;width:5px;height:29%;background:#f2f2f2;transform-origin:bottom}.b1{transform:rotate(-25deg)}.b2{transform:rotate(25deg)}
#finalGlow{background:radial-gradient(circle at 50% 69%,rgba(255,211,159,.28),transparent 38%)}

/* CHARACTER: the sprite itself grows by phase */
.character{position:absolute;bottom:15%;z-index:8;width:70px;height:132px;filter:drop-shadow(0 9px 4px rgba(0,0,0,.42));transition:left 1.2s ease,opacity 1.2s ease,transform 1.8s cubic-bezier(.2,.8,.2,1)}
.character.player{left:42%;transform:translateX(-50%)}
.character.partner{left:59%;opacity:0;transform:translateX(35px) scale(.98)}
.sprite{position:absolute;left:50%;bottom:0;width:60px;height:120px;transform-origin:bottom center;transition:transform 1.8s cubic-bezier(.18,.82,.2,1)}
.sprite span{position:absolute;display:block;transition:all 1.2s ease}
.sprite .head{left:16px;top:7px;width:28px;height:28px;background:#d3aa8f;border-radius:5px;z-index:3}
.sprite .hair{left:11px;top:0;width:38px;height:17px;background:#17181b;border-radius:10px 10px 3px 3px;z-index:4}
.sprite .torso{left:9px;top:34px;width:42px;height:47px;background:#595c63;border-radius:5px;z-index:2}
.sprite .arm{top:41px;width:10px;height:42px;background:#d3aa8f;border-radius:6px;transform-origin:top}.sprite .al{left:3px}.sprite .ar{right:3px}
.sprite .leg{top:77px;width:14px;height:41px;background:#2b2e34;border-radius:4px;transform-origin:top}.sprite .ll{left:12px}.sprite .lr{right:12px}
.sprite .scarf{left:5px;top:29px;width:50px;height:9px;background:#e44742;border-radius:4px;opacity:0;transform:rotate(-6deg)}
.sprite .boot{display:none}
.partner .sprite .torso{background:#76586c}.partner .sprite .hair{height:24px;border-radius:12px 12px 8px 8px}

/* walking animations only affect limbs/bob, never growth scale */
.walk .sprite{animation:bob .5s infinite alternate ease-in-out}
.walk .ll{animation:legF .5s infinite alternate}.walk .lr{animation:legB .5s infinite alternate}.walk .al{animation:armB .5s infinite alternate}.walk .ar{animation:armF .5s infinite alternate}
@keyframes bob{to{bottom:3px}}@keyframes legF{to{transform:rotate(23deg)}}@keyframes legB{to{transform:rotate(-23deg)}}@keyframes armF{to{transform:rotate(18deg)}}@keyframes armB{to{transform:rotate(-18deg)}}

/* growth stages */
.phase-intro .player .sprite,.phase-hero .player .sprite{transform:translateX(-50%) scale(.68)}
.phase-intro .player .head,.phase-hero .player .head{transform:scale(1.16);transform-origin:center bottom}
.phase-intro .player .torso,.phase-hero .player .torso{top:36px;height:40px}
.phase-intro .player .leg,.phase-hero .player .leg{top:73px;height:33px}
.phase-hero .player .scarf{opacity:1}

.phase-soccer .player .sprite{transform:translateX(-50%) scale(.80)}
.phase-soccer .player .head{transform:scale(1.08);transform-origin:center bottom}
.phase-soccer .player .torso{background:#286ca3}
.phase-soccer .player .leg{height:44px}

.phase-script .player .sprite{transform:translateX(-50%) scale(.93)}
.phase-script .player .head{transform:scale(1.02)}
.phase-script .player .torso{background:#30354b;height:50px}
.phase-script .player .leg{top:80px;height:45px}

.phase-wife .player .sprite,.phase-final .player .sprite{transform:translateX(-50%) scale(1.04)}
.phase-wife .player .torso,.phase-final .player .torso{background:#30354b;height:52px}
.phase-wife .player .leg,.phase-final .player .leg{top:82px;height:47px}
.phase-wife .player,.phase-final .player{left:42%}
.phase-wife .partner,.phase-final .partner{opacity:1;transform:translateX(0) scale(1)}

/* copy area: fixed independent layer, manually line-broken */
.copy-zone{position:absolute;z-index:30;left:0;right:0;top:0;height:30%;padding:calc(var(--safe-top) + 7px) 7% 16px;pointer-events:none;background:linear-gradient(180deg,#080a0f 0%,#0b0e14 88%,#11151d 100%);border-bottom:1px solid rgba(255,255,255,.10);display:flex;align-items:center}
.copy{width:100%;max-width:620px;margin:0 auto;text-shadow:none}
.eyebrow{font-size:10px;line-height:1.2;letter-spacing:.18em;font-weight:900;opacity:.76;white-space:nowrap}
.copy h1{margin:8px 0 7px;font-size:clamp(23px,6.1vw,38px);line-height:1.24;letter-spacing:.005em;font-weight:900;color:#fff}
.copy p{margin:0;font-size:clamp(12.5px,3.15vw,17px);line-height:1.55;font-weight:700;color:#cfd4dc}
.line{display:block;white-space:nowrap}

/* age indicator reinforces growth without clutter */
#ageTag{position:absolute;z-index:22;left:7%;bottom:6.5%;font-size:10px;font-weight:900;letter-spacing:.16em;opacity:.62;text-shadow:0 2px 8px #000;transition:opacity .5s}
.icons{position:absolute;z-index:18;right:5%;top:8%;display:grid;gap:8px}.icon{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(5,6,8,.64);border:1px solid rgba(255,255,255,.16);font-size:13px;font-weight:900;opacity:0;transform:scale(.5);transition:.5s}
#progress{position:absolute;z-index:40;left:7%;right:7%;bottom:var(--safe-bottom);height:3px;background:rgba(255,255,255,.15)}#bar{height:100%;width:0;background:#fff}

.overlay{position:absolute;z-index:100;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:12% 9%;background:linear-gradient(rgba(5,6,8,.94),rgba(5,6,8,.99));transition:opacity .6s}.overlay.hidden{opacity:0;pointer-events:none}.kicker{font-size:10px;letter-spacing:.24em;font-weight:900;opacity:.65}.overlay h2{margin:14px 0 10px;font-size:clamp(28px,7.3vw,46px);line-height:1.24}.overlay p{margin:0;max-width:520px;color:#c9c9c9;line-height:1.7;font-size:14px}.overlay .line{white-space:normal}.overlay button{margin-top:28px;border:0;border-radius:999px;padding:15px 44px;background:#fff;color:#111;font-weight:900;letter-spacing:.08em;box-shadow:0 10px 30px rgba(0,0,0,.3)}

/* nostalgic opening: warm memory instead of a black title card */
.overlay{overflow:hidden}
#start{
  justify-content:flex-end;
  padding:0 9% max(11%,calc(var(--safe-bottom) + 42px));
  color:#fff8e9;
  background:
    linear-gradient(to bottom,rgba(72,48,32,.03) 0%,rgba(72,48,32,.12) 42%,rgba(42,28,20,.72) 100%),
    radial-gradient(circle at 76% 22%,rgba(255,224,164,.62) 0 4%,rgba(255,190,116,.22) 5% 16%,transparent 34%),
    linear-gradient(180deg,#8ca2a0 0%,#c3aa82 45%,#8b6547 100%);
}
#start:before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.34;
  background:
    linear-gradient(to top,rgba(44,35,25,.92) 0 15%,transparent 15%),
    linear-gradient(164deg,transparent 0 52%,rgba(52,45,34,.82) 52.4% 58%,transparent 58.4%),
    linear-gradient(196deg,transparent 0 60%,rgba(62,52,37,.7) 60.4% 66%,transparent 66.4%);
}
#start:after{
  content:"";position:absolute;inset:-30%;pointer-events:none;opacity:.22;mix-blend-mode:soft-light;
  background-image:repeating-radial-gradient(circle at 30% 20%,rgba(255,255,255,.55) 0 1px,transparent 1px 4px);
  animation:filmGrain .24s steps(2) infinite;
}
#start .memory-child{position:absolute;z-index:1;left:12%;bottom:19%;width:58px;height:104px;filter:drop-shadow(0 8px 8px rgba(30,20,12,.38))}
#start .memory-child span{position:absolute;display:block}
#start .memory-child .mh{left:17px;top:0;width:27px;height:27px;border-radius:46% 46% 42% 42%;background:#c49a78}
#start .memory-child .mhair{left:12px;top:-3px;width:37px;height:15px;border-radius:12px 12px 4px 4px;background:#302820}
#start .memory-child .mbody{left:11px;top:28px;width:39px;height:40px;border-radius:5px;background:#b25c46}
#start .memory-child .mleg{top:65px;width:12px;height:38px;border-radius:4px;background:#51463b}.memory-child .ml1{left:13px;transform:rotate(5deg)}.memory-child .ml2{right:13px;transform:rotate(-5deg)}
#start .memory-ball{position:absolute;z-index:1;left:31%;bottom:17.5%;width:20px;height:20px;border-radius:50%;background:#d8c9ad;box-shadow:inset 0 0 0 3px rgba(57,48,39,.7);opacity:.72}
#start .opening-copy{position:relative;z-index:3;width:100%;text-shadow:0 2px 18px rgba(37,24,16,.65)}
#start .kicker{color:#f2dfbf;opacity:.86}
#start h2{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-weight:700;letter-spacing:.05em;font-size:clamp(29px,7.5vw,45px)}
#start p{color:#f1e3cb;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:13px}
#start button{background:rgba(255,247,226,.9);color:#51402f;border:1px solid rgba(255,255,255,.55);box-shadow:0 9px 28px rgba(48,31,19,.25);backdrop-filter:blur(4px)}
@keyframes filmGrain{0%{transform:translate(0,0)}25%{transform:translate(1.2%,-.8%)}50%{transform:translate(-.8%,1%)}75%{transform:translate(.6%,.8%)}100%{transform:translate(-.5%,-.6%)}}

/* phases */
.phase-hero #sky{background:linear-gradient(#243349,#a66d65)}.phase-hero #sun{background:#ffd7b6;opacity:.9;box-shadow:0 0 45px #ff9d75}.phase-hero #mountains{background:#555268}.phase-hero #road{background:#5b494f}.phase-hero #heroBeam{opacity:1}.phase-hero #iHero{opacity:1;transform:scale(1)}
.phase-soccer #sky{background:linear-gradient(#58a6df,#bce9ff)}.phase-soccer #sun{background:#fff1a1;opacity:1;box-shadow:0 0 40px #ffe97b}.phase-soccer #mountains{background:#559264}.phase-soccer #ground{background:#3f8c55}.phase-soccer #road{background:#477a50}.phase-soccer #stadium{opacity:1}.phase-soccer #ball{opacity:1;transform:translateX(-260px) rotate(-600deg)}.phase-soccer #iHero,.phase-soccer #iBall{opacity:1;transform:scale(1)}
.phase-script #sky{background:linear-gradient(#161b2b,#433c61)}.phase-script #sun{opacity:.1}.phase-script #mountains{background:#2d3140}.phase-script #ground{background:#232632}.phase-script #road{background:#383b49}.phase-script #scriptWorld{opacity:1}.phase-script #iHero,.phase-script #iBall,.phase-script #iScript{opacity:1;transform:scale(1)}
.phase-wife #sky,.phase-final #sky{background:linear-gradient(#744a60,#efa98f)}.phase-wife #sun,.phase-final #sun{background:#ffe3c7;opacity:.95;box-shadow:0 0 55px #ffd0ad}.phase-wife #mountains,.phase-final #mountains{background:#7b675f}.phase-wife #ground,.phase-final #ground{background:#557b57}.phase-wife #road,.phase-final #road{background:#74635f}.phase-wife #iHero,.phase-wife #iBall,.phase-wife #iScript,.phase-wife #iHeart,.phase-final .icon{opacity:1;transform:scale(1)}.phase-final #finalGlow{opacity:1}

@media (max-width:360px){.copy h1{font-size:21px}.copy p{font-size:11.5px}.copy-zone{padding-left:5.5%;padding-right:5.5%}.copy .line{white-space:nowrap}.overlay .line{white-space:normal}}

@media (max-height:700px){
  .copy-zone{height:32%;padding-top:calc(var(--safe-top) + 2px);padding-bottom:10px}
  .world{top:32%}
  .copy h1{font-size:clamp(20px,5.6vw,32px);margin:6px 0 5px}
  .copy p{font-size:clamp(11px,2.9vw,15px);line-height:1.45}
  .eyebrow{font-size:9px}
}
@media (min-width:700px){#app{left:50%;right:auto;width:56.25vh;transform:translateX(-50%);box-shadow:0 0 70px #000}}
</style>
</head>
<body>
<div id="app" class="phase-intro">
  <div class="world"><div style="position:absolute;left:0;right:0;top:0;height:18px;background:linear-gradient(#11151d,transparent);z-index:25;pointer-events:none"></div>
    <div id="sky"><div id="sun"></div></div>
    <div id="mountains"></div><div id="ground"></div><div id="road"></div>
    <div id="heroBeam" class="scene-layer"><div id="giant"><span class="head"></span><span class="body"></span><span class="arm ga1"></span><span class="arm ga2"></span></div></div>
    <div id="stadium" class="scene-layer"><div class="field"></div><div class="goal"></div></div><div id="ball"></div>
    <div id="scriptWorld" class="scene-layer"><div class="paper p1">「行く」</div><div class="paper p2">「戻る」</div><div class="paper p3">「続ける」</div><div class="branch b1"></div><div class="branch b2"></div></div>
    <div id="finalGlow" class="scene-layer"></div>

    <div class="character player walk"><div class="sprite"><span class="head"></span><span class="hair"></span><span class="torso"></span><span class="arm al"></span><span class="arm ar"></span><span class="leg ll"></span><span class="leg lr"></span><span class="scarf"></span></div></div>
    <div id="partner" class="character partner"><div class="sprite"><span class="head"></span><span class="hair"></span><span class="torso"></span><span class="arm al"></span><span class="arm ar"></span><span class="leg ll"></span><span class="leg lr"></span></div></div>

    <div class="icons"><div id="iHero" class="icon">✦</div><div id="iBall" class="icon">●</div><div id="iScript" class="icon">A</div><div id="iHeart" class="icon">♥</div></div>
    <div id="ageTag">CHILDHOOD</div>
  </div>

  <div class="copy-zone"><div class="copy"><div id="chapter" class="eyebrow">PROLOGUE</div><h1 id="headline"></h1><p id="subline"></p></div></div>
  <div id="progress"><div id="bar"></div></div>

  <div id="start" class="overlay"><div class="memory-child" aria-hidden="true"><span class="mh"></span><span class="mhair"></span><span class="mbody"></span><span class="mleg ml1"></span><span class="mleg ml2"></span></div><div class="memory-ball" aria-hidden="true"></div><div class="opening-copy"><div class="kicker">60 SECOND LIFE</div><h2><span class="line">好きなものが、</span><span class="line">私をつくった。</span></h2><p><span class="line">あの頃、夢中になったものから。</span><span class="line">人生を一緒に歩く人まで。</span></p><button id="startBtn">START</button></div></div>
  <div id="end" class="overlay hidden"><div class="kicker">EPILOGUE</div><h2><span class="line">好きなものに出会うたび、</span><span class="line">人生は少しずつ変わっていった。</span></h2><p><span class="line">そして、今は</span><span class="line">二人で歩いている。</span></p><button id="replayBtn">REPLAY</button></div>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id);
const app=$('app'),start=$('start'),end=$('end'),startBtn=$('startBtn'),replayBtn=$('replayBtn'),chapter=$('chapter'),headline=$('headline'),subline=$('subline'),bar=$('bar'),partner=$('partner'),ageTag=$('ageTag');
const scenes=[
 {t:0,cls:'phase-intro',chapter:'PROLOGUE',age:'CHILDHOOD',h:['まだ、何者でもなかった。'],s:['ただ一本道を','歩いていた。']},
 {t:4200,cls:'phase-hero',chapter:'CHAPTER 01 / HERO',age:'AGE 6',h:['最初に好きになったのは、','ヒーローだった。'],s:['強くて、まっすぐで、','子どもの自分には眩しかった。']},
 {t:15000,cls:'phase-soccer',chapter:'CHAPTER 02 / FOOTBALL',age:'AGE 10',h:['次に、サッカーに','夢中になった。'],s:['走って、蹴って、','悔しがることまで楽しかった。']},
 {t:27000,cls:'phase-script',chapter:'CHAPTER 03 / STORY',age:'AGE 18',h:['その次は、','物語をつくること。'],s:['ゲームシナリオを書いて、','選択肢の先に世界をつくった。']},
 {t:41500,cls:'phase-wife',chapter:'CHAPTER 04 / YOU',age:'ADULT',h:['そして、','妻に出会った。'],s:['好きなものを追いかけていた道に、','もう一人が並んだ。']},
 {t:53000,cls:'phase-final',chapter:'EPILOGUE',age:'NOW',h:['好きなものが、','私をつくった。'],s:['そして、今は','二人で歩いている。']}
];
let timers=[],raf=0,t0=0;const D=60000;
function renderLines(el,lines){el.innerHTML=lines.map(x=>`<span class="line">${x}</span>`).join('')}
function setScene(sc){app.className=sc.cls;chapter.textContent=sc.chapter;ageTag.textContent=sc.age;renderLines(headline,sc.h);renderLines(subline,sc.s)}
function stop(){timers.forEach(clearTimeout);timers=[];cancelAnimationFrame(raf);bar.style.width='0%';end.classList.add('hidden');partner.classList.remove('walk');setScene(scenes[0])}
function later(fn,ms){timers.push(setTimeout(fn,ms))}
function tick(){const p=Math.min(1,(performance.now()-t0)/D);bar.style.width=(p*100)+'%';if(p<1)raf=requestAnimationFrame(tick)}
function begin(){stop();start.classList.add('hidden');t0=performance.now();scenes.slice(1).forEach(sc=>later(()=>setScene(sc),sc.t));later(()=>partner.classList.add('walk'),43000);later(()=>end.classList.remove('hidden'),D);raf=requestAnimationFrame(tick)}
startBtn.addEventListener('click',begin);replayBtn.addEventListener('click',begin);setScene(scenes[0]);
})();
</script>
</body>
</html>
